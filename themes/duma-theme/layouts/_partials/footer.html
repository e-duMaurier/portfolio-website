<footer class="bg-light text-center text-dark py-4 mt-auto">
  <div class="container">
    <div class="mb-2">
      <button
        class="btn btn-link theme-toggle"
        id="theme-toggle"
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >
        <i class="bi bi-sun-fill" id="theme-icon"></i>
      </button>
    </div>
    <div class="mb-3">
      <a
        href="https://gohugo.io"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Hugo website"
        class="text-dark mx-2"
      >
        <i class="bi bi-globe2" style="font-size: 1.5rem"></i>
      </a>
      <a
        href="https://go.dev"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Go website"
        class="text-dark mx-2"
      >
        <i class="bi bi-globe2" style="font-size: 1.5rem"></i>
      </a>
    </div>
    <div>&copy; {{ site.Title }} {{ now.Year }}</div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</footer>

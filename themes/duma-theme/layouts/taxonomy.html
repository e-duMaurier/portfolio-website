{{ define "main" }}
<div class="container my-5">
  <h1 class="text-center">{{ .Title }}</h1>
  {{ if not .Pages }}
  <p class="text-center lead">
    There is nothing here yet, please come back later.
  </p>
  {{ else }}
  <div class="post-tags justify-content-center mt-4">
    {{ range .Pages }}
    <a class="tag-pill" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    {{ end }}
  </div>
  {{ end }}
</div>
{{ end }}
